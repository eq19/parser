name: Docker Deploy Action

description: >
  🪂  A Github Action to deploy pages

branding:
  icon: 'command'
  color: 'yellow'

inputs:
  docker_hub_username:
    description: Username for Docker Hub
    default: ${{ github.actor }}
    required: false
  docker_hub_password:
    description: Docker Hub password
    required: true
  docker_hub_token:
    description: Docker Hub authentication token
    required: true
  initiate_pauli_sum:
    description: Build args
    required: false
    default: ""
  image_name:
    description: Tag to use for the new image
    default: ${{ github.action_repository }}
    required: true
  credentials:
    description: The Google cloud credentials
    required: true
  token:
    description: The Github personal token
    required: true
  gell_mann:
    description: 'The pre-build configuration'
    required: true
  id:
    description: The id according to os
    required: true

outputs:
  all_outputs:
    description: Collect all outputs
    value: ${{ toJSON(steps.*.outputs) }}

runs:
  using: composite
  steps:

    - shell: bash
      run: |
        echo ${{ inputs.gell_mann }}
        echo ${{ inputs.gell_mann.spin }}
        echo ${{ toJSON(inputs.gell_mann) }}

    - name: Target Configuration
      if: runner.os != 'Windows'
      uses: eq19/eq19/.github/actions/3-exponentiation/4-parser@v1
      id: exponentiation
      with:
        hub_username: ${{ inputs.docker_hub_username }}
        hub_password: ${{ inputs.docker_hub_password }}
        hub_token: ${{ inputs.docker_hub_token }}
        credentials: ${{ inputs.credentials }}
        action_path: ${{ github.action_path }}
        image_name: ${{ inputs.image_name }}
        token: ${{ inputs.token }}

    - name: Profiling Feedback
      if: runner.os == 'Windows'
      uses: eq19/eq19/.github/actions/4-identition/4-parser@v1
      id: identition
      with:
        token: ${{ inputs.token }}
        image_name: ${{ inputs.image_name }}
        credentials: ${{ inputs.credentials }}
        action_path: ${GITHUB_ACTION_PATH//\\//}
        hub_token: ${{ inputs.docker_hub_token }} 
        hub_username: ${{ inputs.docker_hub_username }}
